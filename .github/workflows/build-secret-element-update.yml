name: Build Secret Element progression update

on:
  push:
    branches:
      - fix/secret-element-progression
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Original APK bundle release tag"
        required: true
        default: "original-1.0.7"
      asset_name:
        description: "Original split APK bundle filename"
        required: true
        default: "Elementals-Defense_1.0.7_apkcube.1.apks"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk curl unzip zip python3
          java -version

      - name: Download original bundle from release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          ASSET_NAME: ${{ inputs.asset_name }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          repo = os.environ["GH_REPOSITORY"]
          tag = os.environ["RELEASE_TAG"]
          asset_name = os.environ["ASSET_NAME"]
          token = os.environ["GH_TOKEN"]
          def get(url, accept="application/vnd.github+json"):
              req = urllib.request.Request(url, headers={
                  "Authorization": "Bearer " + token,
                  "Accept": accept,
                  "X-GitHub-Api-Version": "2022-11-28",
              })
              return urllib.request.urlopen(req)
          with get(f"https://api.github.com/repos/{repo}/releases/tags/{tag}") as response:
              release = json.load(response)
          asset = next((a for a in release["assets"] if a["name"] == asset_name), None)
          if asset is None:
              names = ", ".join(repr(a["name"]) for a in release["assets"])
              raise SystemExit(f"Asset {asset_name!r} not found. Available: {names or '(none)'}")
          with get(asset["url"], "application/octet-stream") as response, open("original.apks", "wb") as output:
              while True:
                  chunk = response.read(1024 * 1024)
                  if not chunk:
                      break
                  output.write(chunk)
          PY
          sha256sum original.apks | tee original-sha256.txt

      - name: Build and sign patched split APK bundle
        run: tools/build-patched.sh "$GITHUB_WORKSPACE/original.apks" "$GITHUB_WORKSPACE/build"

      - name: Verify output bundle
        run: |
          test -s build/elementals-defense-1.0.7-ads-free.apks
          unzip -t build/elementals-defense-1.0.7-ads-free.apks
          cat build/output-sha256.txt
          cat build/signing-cert.txt

      - name: Upload installable bundle
        uses: actions/upload-artifact@v4
        with:
          name: elementals-defense-secret-elements-1.0.7
          path: |
            build/elementals-defense-1.0.7-ads-free.apks
            build/output-sha256.txt
            build/signing-cert.txt
            original-sha256.txt
          retention-days: 30
