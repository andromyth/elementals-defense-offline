name: Inspect original Android bundle

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Private release tag containing the original .apks asset"
        required: true
        default: "original-1.0.7"
      asset_name:
        description: "Exact release asset filename"
        required: true
        default: "Elementals-Defense_1.0.7_apkcube.1.apks"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip openjdk-17-jdk
          curl -fsSL https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool -o /usr/local/bin/apktool
          sudo chmod +x /usr/local/bin/apktool
          curl -fsSL https://bitbucket.org/iBotPeaches/apktool/downloads/apktool_2.11.1.jar -o /usr/local/bin/apktool.jar
          printf '#!/bin/sh\nexec java -jar /usr/local/bin/apktool.jar "$@"\n' | sudo tee /usr/local/bin/apktool >/dev/null
          sudo chmod +x /usr/local/bin/apktool
          curl -fsSL https://github.com/skylot/jadx/releases/download/v1.5.1/jadx-1.5.1.zip -o /tmp/jadx.zip
          sudo unzip -q /tmp/jadx.zip -d /opt/jadx
          sudo ln -sf /opt/jadx/bin/jadx /usr/local/bin/jadx
          jadx --version
          apktool --version

      - name: Download original bundle from private release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          ASSET_NAME: ${{ inputs.asset_name }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          repo = os.environ["GH_REPOSITORY"]
          tag = os.environ["RELEASE_TAG"]
          asset_name = os.environ["ASSET_NAME"]
          token = os.environ["GH_TOKEN"]
          def get(url):
              req = urllib.request.Request(url, headers={
                  "Authorization": "Bearer " + token,
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              })
              with urllib.request.urlopen(req) as r:
                  return json.load(r)
          release = get(f"https://api.github.com/repos/{repo}/releases/tags/{tag}")
          asset = next((a for a in release["assets"] if a["name"] == asset_name), None)
          if asset is None:
              names = ", ".join(repr(a["name"]) for a in release["assets"])
              raise SystemExit(f"Asset {asset_name!r} not found on release {tag!r}. Available assets: {names or '(none)'}")
          req = urllib.request.Request(asset["url"], headers={
              "Authorization": "Bearer " + token,
              "Accept": "application/octet-stream",
              "X-GitHub-Api-Version": "2022-11-28",
          })
          with urllib.request.urlopen(req) as r, open("original.apks", "wb") as f:
              while True:
                  chunk = r.read(1024 * 1024)
                  if not chunk: break
                  f.write(chunk)
          PY
          sha256sum original.apks | tee input-sha256.txt

      - name: Extract and inspect
        run: |
          mkdir -p work reports
          unzip -q original.apks -d work/apks
          BASE="$(find work/apks -type f -name base.apk -print -quit)"
          test -n "$BASE"
          sha256sum "$BASE" | tee reports/base-apk-sha256.txt
          apktool d -f "$BASE" -o work/decoded
          jadx --show-bad-code -d work/jadx "$BASE" >/dev/null 2>&1 || true
          grep -oE 'android.permission.[A-Z_]+' work/decoded/AndroidManifest.xml | sort -u > reports/permissions.txt || true
          grep -RniE 'firebase.analytics|crashlytics|appmetrica|applovin|chartboost|ironsource|levelplay|vungle|facebook.ads|google.android.gms.ads|mbridge|bidmachine|adjust|appsflyer' work/jadx --include='*.java' --include='*.kt' | head -n 1000 > reports/telemetry-leads.txt || true
          grep -RniE 'wall|health|damage|hitPoints|hit_points|baseHealth|castle' work/jadx --include='*.java' --include='*.kt' | head -n 1000 > reports/wall-health-leads.txt || true
          {
            echo "## Input bundle SHA-256"; cat input-sha256.txt
            echo "## Base APK SHA-256"; cat reports/base-apk-sha256.txt
            echo "## Permissions"; cat reports/permissions.txt
            echo "## Wall-health search leads"; cat reports/wall-health-leads.txt
            echo "## Telemetry search leads"; cat reports/telemetry-leads.txt
          } > reports/inspection-summary.md

      - name: Upload inspection report
        uses: actions/upload-artifact@v4
        with:
          name: elementals-inspection-reports
          path: |
            reports/
            input-sha256.txt
          retention-days: 14
